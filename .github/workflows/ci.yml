name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    name: Go (CLI + engine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./cmd/radius-analyze

  parser:
    name: TS parser (parity vs shared fixtures)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: parser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: parser/package-lock.json
      - run: npm ci
      - run: npm test
